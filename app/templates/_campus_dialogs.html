<dialog id="meetupFormDialog" aria-labelledby="meetupFormTitle"><h2 id="meetupFormTitle">发出运动邀请</h2><form id="meetupForm"><label>运动项目<input id="inviteSport" list="exerciseOptions" maxlength="50" required></label><label>开始时间<input id="inviteTime" type="datetime-local" required></label><div class="form-grid"><label>时长 / 分钟<input id="inviteDuration" type="number" min="15" max="360" value="60" required></label><label>集合地点<input id="invitePlace" maxlength="200" required placeholder="具体到场地或集合点"></label></div><p class="fine">收到回复前，邀请处于待确认状态。改约需要所有参与者同意；未通过时保留原安排。</p><p id="inviteMsg" class="msg" role="status"></p><div class="actions"><button type="submit" id="inviteSubmit">发送邀请</button><button type="button" class="ghost" data-close-dialog="meetupFormDialog">返回</button></div></form></dialog>
<dialog id="cancelMeetupDialog" aria-labelledby="cancelMeetupTitle"><h2 id="cancelMeetupTitle">说明取消原因</h2><form id="cancelMeetupForm"><label>给同伴一个说明<textarea id="cancelReason" rows="3" maxlength="500" required placeholder="例如：临时有课，抱歉这次不能参加。"></textarea></label><p class="fine">提前至少 2 小时取消算正常取消。取消原因只对参与者可见，不直接扣评分。</p><p id="cancelMeetupMsg" class="msg" role="status"></p><div class="actions"><button type="submit" id="cancelMeetupSubmit" class="danger">确认取消</button><button type="button" class="ghost" data-close-dialog="cancelMeetupDialog">保留约定</button></div></form></dialog>
<dialog id="reportDialog" aria-labelledby="reportTitle"><h2 id="reportTitle">举报问题</h2><form id="reportForm"><p id="reportTarget" class="fine"></p><label>具体情况<textarea id="reportReason" minlength="5" maxlength="1000" rows="4" required placeholder="请说明发生了什么、时间及相关情况，至少五个字。"></textarea></label><p class="fine">举报内容仅本人和管理员可见。举报不会自动拉黑，你可以另行加入黑名单。</p><p id="reportMsg" class="msg" role="status"></p><div class="actions"><button type="submit" id="reportSubmit">提交举报</button><button type="button" class="ghost" data-close-dialog="reportDialog">取消</button></div></form></dialog>
<dialog id="adminDialog" aria-labelledby="adminDialogTitle"><h2 id="adminDialogTitle">处理举报</h2><form id="adminForm"><label>处理方式<select id="adminAction"><option value="resolve">记录处理结果</option><option value="dismiss">证据不足，暂不处理</option><option value="hide_activity">下架被举报状态</option><option value="suspend_7d">限制社交功能 7 天</option><option value="restore">解除社交限制</option></select></label><label>处理说明<textarea id="adminResolution" minlength="5" maxlength="1000" rows="3" required></textarea></label><p id="adminDialogMsg" class="msg" role="status"></p><div class="actions"><button type="submit" id="adminSubmit">保存处理结果</button><button type="button" class="ghost" data-close-dialog="adminDialog">返回</button></div></form></dialog>
<aside id="messageBanner" class="message-banner hidden" aria-live="polite"><button type="button" id="openMessageBanner"><span class="banner-symbol" aria-hidden="true">↗</span><span><strong id="messageBannerTitle">收到新消息</strong><small id="messageBannerBody">轻点查看</small></span></button><button type="button" id="dismissMessageBanner" aria-label="关闭消息提示">×</button></aside>
